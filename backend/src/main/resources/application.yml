server:
  port: ${PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/crms}
      database: ${MONGODB_DATABASE:crms}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-me-please-32chars}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  file-storage-path: ${FILE_STORAGE_PATH:uploads}
crms:
  bootstrap:
    admin-email: ${CRMS_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${CRMS_BOOTSTRAP_ADMIN_PASSWORD:}
